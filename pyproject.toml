[project]
name = "python06-bis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [ ]

[tool.pyrefly]
preset = "all"

[tool.ruff.lint]
# Enable absolutely everything by default
select = ["ALL"]

ignore = [
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in __init__
    "D203",    # One blank line before class docstring (conflicts with D211)
    "D213",    # Multi-line docstring summary start (conflicts with D212)
    "COM812",  # Missing trailing comma (conflicts with ruff formatter)
    "ISC001",  # Implicit string concatenation (conflicts with ruff formatter)
    "CPY001",  # Missing copyright
    "T201",    # using print()
    "D101",    # missing docstring for public class
    "D102",    # missing docstring for public method
    "D103",    # missing docstring for public functions
    "D105",    # missing docstring for magic method
]

# Ensure you enforce type checking annotations strictly
[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
suppress-dummy-args = false
suppress-none-returning = false
mypy-init-return = true

# Enforce strict import ordering
[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

# Require explicit updates when code changes
[tool.ruff.lint.pydocstyle]
convention = "google" # or "numpy" / "pep257"'

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "allowed>=1.5.4",
    "mypy>=2.4.1",
    "pre-commit>=4.6.2",
    "pyrefly>=1.4.0",
    "pytype>=2024.10.11",
]
